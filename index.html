<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Corey Math Games!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
.body {
  background-color: "FFDEAD";
}
.lixoo{
  justify-content: right;
  display: flex;
}
#corey {
  position: absolute;
  text-align: center;
  cursor: move;

}
#corey:active{
  animation-name: jiggle , andar;
  animation-duration: 0.8s , 150ms;
  animation-direction: alternate;
  animation-iteration-count: infinite , 1;
  transform-origin: 70% 30%;
  animation-timing-function: ease-in-out;
    animation-fill-mode: backwards , forwards; 
}
@keyframes andar{
  100%{
  scale: 1.2;
  }
}
@keyframes jiggle{
  0%{
  transform: rotate(-30deg);
  }
  100%{
    transform: rotate(-65deg);
  }
}
    </style>
  </head>
  <body>
    
    <h1>Hiii sarahh ilyyy! :3</h1>

      <img src="img/coreyfront.png" alt="" style="max-width:30%;height:25%;" id="corey">
      <div class="lixoo col-md-12 col-sm-12">
      <img src="img/lixo.png">
      </div>
      <button type="button" id="mover">teleport him</button>
    
    <script src="js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script>
let draggableElem = document.getElementById("corey");
let initialX = 0,
  initialY = 0;
let moveElement = false;
//Events Object
let events = {
  mouse: {
    down: "mousedown",
    move: "mousemove",
    up: "mouseup",
  },
  touch: {
    down: "touchstart",
    move: "touchmove",
    up: "touchend",
  },
};
let deviceType = "";
//Detech touch device
const isTouchDevice = () => {
  try {
    //We try to create TouchEvent (it would fail for desktops and throw error)
    document.createEvent("TouchEvent");
    deviceType = "touch";
    return true;
  } catch (e) {
    deviceType = "mouse";
    return false;
  }
};
isTouchDevice();
//Start (mouse down / touch start)
draggableElem.addEventListener(events[deviceType].down, (e) => {
  e.preventDefault();
  coreygrabbed();
  //initial x and y points
  initialX = !isTouchDevice() ? e.clientX : e.touches[0].clientX;
  initialY = !isTouchDevice() ? e.clientY : e.touches[0].clientY;
  //Start movement
  moveElement = true;
});
//Move
draggableElem.addEventListener(events[deviceType].move, (e) => {
  //if movement == true then set top and left to new X andY while removing any offset
  if (moveElement) {
    e.preventDefault();
    let newX = !isTouchDevice() ? e.clientX : e.touches[0].clientX;
    let newY = !isTouchDevice() ? e.clientY : e.touches[0].clientY;
    draggableElem.style.top =
      draggableElem.offsetTop - (initialY - newY) + "px";
    draggableElem.style.left =
      draggableElem.offsetLeft - (initialX - newX) + "px";
    initialX = newX;
    initialY = newY;
  }
});
//mouse up / touch end
draggableElem.addEventListener(
  events[deviceType].up,
  ( stopMovement = (e) => {
    moveElement = false;
  })
  
);
draggableElem.addEventListener("mouseleave", stopMovement);
draggableElem.addEventListener(events[deviceType].up, (e) => {
  coreystand();
  moveElement = false;
});


  function coreystand(){
    const img=document.getElementById('corey');
    img.src = 'img/coreyfront.png';
  }

  function coreygrabbed() {
    const img=document.getElementById('corey');
    img.src = 'img/coreygrab.png';
  }

    </script>
</body>
</html>
